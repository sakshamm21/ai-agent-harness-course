name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Content checks (frontmatter, MDX, word counts)
        run: node scripts/validate-content.mjs
      - name: Agent Lab engine and scenarios (starter fails, solution passes)
        run: npm test
      - run: python -m pip install pytest
      - name: agentkit_mini tests
        run: python -m pytest -q python/tests
        env: { PYTHONPATH: python }
      - name: Code labs (starter fails, solution passes)
        run: python scripts/check_codelabs.py
      - name: Build (Astro + Pagefind)
        run: npm run build
      - name: Internal link check
        run: npm run check

  projects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [nanoharness, supportbot, deepresearch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pytest
      - name: Reference solution passes on the mock model
        working-directory: projects/${{ matrix.project }}
        run: python -m pytest -q
        env: { IMPL: solution }
